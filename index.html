<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D ग्रैनी स्टाइल हॉरर गेम</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; overflow: hidden; font-family: sans-serif; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        
        #hud {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            color: #ff3333; font-weight: bold; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 8px; border: 1px solid #ff0000;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: red;
            border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 10; pointer-events: none;
        }

        /* Controls Panel */
        #controls-panel {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 20; padding: 0 20px;
        }

        .btn {
            background: #800000; color: #fff; border: 2px solid #ff3333;
            padding: 12px 18px; border-radius: 8px; font-weight: bold;
            font-size: 1rem; cursor: pointer; box-shadow: 0 0 10px #ff0000;
        }
        .btn:active { transform: scale(0.95); background: #b30000; }

        #joystick-zone {
            width: 100px; height: 100px; background: rgba(255,0,0,0.2);
            border: 2px solid #ff0000; border-radius: 50%; position: relative;
            touch-action: none; display: flex; justify-content: center; align-items: center;
        }
        #joystick-knob {
            width: 40px; height: 40px; background: #ff0000; border-radius: 50%; position: absolute;
        }
    </style>
    <!-- Three.js Library for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div>स्थान: 3D हवेली</div>
        <div id="status">बच्चा: कमरे में बंद (चाबी ढूंढ रहा है)</div>
        <div style="color: #00ff00; margin-top:5px;">आपकी शक्ति: दीवारों के आर-पार जाने की छूट! 👻</div>
    </div>

    <div id="crosshair"></div>

    <div id="canvas-container"></div>

    <div id="controls-panel">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <button class="btn" onclick="catchKid()">⚡ बच्चे को दबोचो!</button>
        <button class="btn" onclick="toggleGhostMode()">👻 वॉलब्रैक मोड</button>
    </div>

    <script>
        // 3D Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050202, 0.08); // Horror Fog Effect

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xff3333, 2, 20);
        scene.add(pointLight);

        // Textures & Materials
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x3d1e1e });
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const doorMat = new THREE.MeshBasicMaterial({ color: 0x8b4513 });
        const boxMat = new THREE.MeshBasicMaterial({ color: 0xd2b48c });

        // Build 3D House Environment
        // Floor
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Walls (Collision boundary for Kid)
        const walls = [];
        function createWall(x, z, w, d) {
            const geo = new THREE.BoxGeometry(w, 4, d);
            const wall = new THREE.Mesh(geo, wallMat);
            wall.position.set(x, 2, z);
            scene.add(wall);
            walls.push(wall);
        }

        // Room Walls Boundary
        createWall(0, -10, 20, 0.5); // Back Wall
        createWall(-10, 0, 0.5, 20); // Left Wall
        createWall(10, 0, 0.5, 20);  // Right Wall
        createWall(-4, 0, 12, 0.5);  // Bedroom Wall Left Side
        createWall(6, 0, 8, 0.5);    // Bedroom Wall Right Side

        // Door
        const doorGeo = new THREE.BoxGeometry(2, 3.5, 0.2);
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(1, 1.75, 0);
        scene.add(door);

        // Secret Box inside Kid's Bedroom
        const boxGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(-6, 0.4, -6);
        scene.add(box);

        // Kid (3D Character)
        const kidGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const kidMat = new THREE.MeshBasicMaterial({ color: 0x00bfff });
        const kid = new THREE.Mesh(kidGeo, kidMat);
        kid.position.set(-7, 0.5, -7);
        scene.add(kid);

        // Player (Camera Position)
        camera.position.set(0, 1.6, 6);

        // AI Logic & Game State
        let kidState = { hasKey: false, doorOpen: false, speed: 0.02 };
        let playerGhostMode = true; // Immunity: Player can move through walls!

        // Joystick Controls
        let moveForward = 0, moveSide = 0;
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let isDragging = false;

        joyZone.addEventListener('pointerdown', (e) => { isDragging = true; updateJoy(e); });
        window.addEventListener('pointermove', (e) => { if (isDragging) updateJoy(e); });
        window.addEventListener('pointerup', () => {
            isDragging = false;
            moveForward = 0; moveSide = 0;
            joyKnob.style.transform = `translate(0px, 0px)`;
        });

        function updateJoy(e) {
            const rect = joyZone.getBoundingClientRect();
            let dx = e.clientX - (rect.left + rect.width / 2);
            let dy = e.clientY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy);
            let max = 30;

            if (dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveSide = dx / max;
            moveForward = -dy / max;
        }

        function toggleGhostMode() {
            playerGhostMode = !playerGhostMode;
            alert(playerGhostMode ? "आर-पार जाने की शक्ति चालू (Ghost Mode ON)!" : "Ghost Mode OFF");
        }

        function catchKid() {
            let dist = camera.position.distanceTo(kid.position);
            if (dist < 2.5) {
                alert("अमी जे तोमार! आपने बच्चे को 3D रूम में पकड़ लिया!");
                resetKid();
            } else {
                alert("बच्चा दूर है! उसके पास जाएं।");
            }
        }

        function resetKid() {
            kid.position.set(-7, 0.5, -7);
            kidState.hasKey = false;
            kidState.doorOpen = false;
            door.position.set(1, 1.75, 0); // Door Closed
            document.getElementById('status').innerText = "बच्चा: कमरे में बंद (चाबी ढूंढ रहा है)";
        }

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Player Movement (With Immunity to Walls)
            camera.translateX(moveSide * 0.08);
            camera.translateZ(-moveForward * 0.08);
            camera.position.y = 1.6; // Keep Camera at Eye Level

            pointLight.position.copy(camera.position);

            // Kid AI Walking Logic (No Wall Clipping!)
            if (!kidState.hasKey) {
                // Step 1: Walk to Box inside bedroom
                kid.position.x += (box.position.x - kid.position.x) * kidState.speed;
                kid.position.z += (box.position.z - kid.position.z) * kidState.speed;

                if (kid.position.distanceTo(box.position) < 0.6) {
                    kidState.hasKey = true;
                    document.getElementById('status').innerText = "बच्चा: डब्बे से चाबी मिल गई! 🔑 (दरवाजे की तरफ बढ़ रहा है)";
                }
            } 
            else if (!kidState.doorOpen) {
                // Step 2: Walk to Bedroom Door
                kid.position.x += (door.position.x - kid.position.x) * kidState.speed;
                kid.position.z += (door.position.z - kid.position.z) * kidState.speed;

                if (kid.position.distanceTo(door.position) < 0.8) {
                    kidState.doorOpen = true;
                    door.position.y = 5; // Open Door Upwards
                    document.getElementById('status').innerText = "बच्चा: गेट खोलकर बाहर निकल आया!";
                }
            } 
            else {
                // Step 3: Walk slowly in Hallway
                kid.position.z += 0.015;
                if(kid.position.z > 8) {
                    document.getElementById('status').innerText = "बच्चा एस्केप कर गया!";
                    resetKid();
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
