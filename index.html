<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>SD Cricket World</title>
  <style>
    body {
      margin: 0;
      background-color: #0b132b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* Start Screen Layout */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 19, 43, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    h1 {
      font-size: 36px;
      color: #f7b801;
      margin-bottom: 20px;
    }

    /* Play Button Style */
    #play-btn {
      padding: 15px 45px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      background-color: #ff0055;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    #play-btn:hover {
      background-color: #e0004c;
      transform: scale(1.05);
    }

    /* Game Canvas Area */
    #gameCanvas {
      margin-top: 30px;
      border: 3px solid #f7b801;
      background-color: #1c2541;
    }
  </style>
</head>
<body>

  <!-- Start Screen UI -->
  <div id="start-screen">
    <h1>SD Cricket World</h1>
    <button id="play-btn">PLAY GAME</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const playBtn = document.getElementById("play-btn");
      const startScreen = document.getElementById("start-screen")

        // 2. गेम की स्टार्ट स्क्रीन छुपाएं
        startScreen.style.display = "none";

        // 3. गेम स्टार्ट करें
        startGame();
      });

      function startGame() {
        console.log("SD Cricket World Started!");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // गेम स्क्रीन टेक्स्ट
        ctx.fillStyle = "#f7b801";
        ctx.font = "24px Arial";
        ctx.fillText("Welcome to SD Cricket World!", 140, 200);
      }
    });
  </script>
</body>
</html>
