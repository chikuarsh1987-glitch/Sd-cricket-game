<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD Cricket World</title>

  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: white; text-align: center; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .interactive { pointer-events: auto; }
    .hidden { display: none !important; }
    
    /* Screens */
    #welcome-screen, #loading-screen, #setup-screen, #game-over-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10;
    }
    
    .btn-play { background: #27ae60; color: white; border: none; padding: 12px 24px; font-size: 1.2rem; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    .btn-play:active { transform: scale(0.95); }
    
    /* Scoreboard & Controls */
    #scoreboard { background: rgba(0,0,0,0.7); padding: 10px; font-size: 1.1rem; display: flex; justify-content: space-around; }
    #controls { padding: 15px; background: rgba(0,0,0,0.5); }
    .shot-btn { background: #e67e22; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 4px; cursor: pointer; }
    
    /* Ad Modal */
    #ad-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
    }
  </style>
</head>
<body>

  <!-- WELCOME SCREEN -->
  <div id="welcome-screen">
    <h1>SD Cricket World</h1>
    <p>3D Realistic Cricket Simulator</p>
    <button class="btn-play" onclick="startGame()">Play Now</button>
  </div>

  <!-- GAME UI -->
  <div id="ui-layer" class="hidden">
    <div id="scoreboard" class="interactive">
      <div>Score: <span id="runs">0</span>/<span id="wickets">0</span></div>
      <div>Overs: <span id="overs">0.0</span></div>
    </div>
    
    <div id="controls" class="interactive">
      <button class="shot-btn" onclick="playShot('Lofted')">Lofted</button>
      <button class="shot-btn" onclick="playShot('Ground')">Ground</button>
      <button class="shot-btn" onclick="playShot('Defend')">Defend</button>
    </div>
  </div>

  <!-- OVER END AD MODAL -->
  <div id="ad-modal" class="hidden">
    <h2>Over Complete!</h2>
    <p>Loading next over...</p>

    <button class="btn-play" onclick="closeAd()">Continue Game</button>
  </div>

  <script>
    let totalRuns = 0;
    let wickets = 0;
    let totalBalls = 0;

    // आपका Smartlink_3 का URL (अगर आपने कॉपी किया हुआ पूरा लिंक अलग है तो नीचे वाले URL में पेस्ट कर लें)
    const smartlinkUrl = "https://www.highperformanceformat.com/3134772";

    function startGame() {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('ui-layer').classList.remove('hidden');
    }

    function playShot(type) {
      let possibleRuns = [0, 1, 2, 4, 6, 'W'];
      let outcome = possibleRuns[Math.floor(Math.random() * possibleRuns.length)];

      if (outcome === 'W') {
        wickets++;
      } else {
        totalRuns += outcome;
      }
      totalBalls++;

      updateScoreboard();

      // ओवर खत्म (हर 6 गेंद पर)
      if (totalBalls % 6 === 0) {
        showOverAd();
      }
    }

    function updateScoreboard() {
      document.getElementById('runs').innerText = totalRuns;
      document.getElementById('wickets').innerText = wickets;
      let overs = Math.floor(totalBalls / 6);
      let balls = totalBalls % 6;
      document.getElementById('overs').innerText = `${overs}.${balls}`;
    }

    function showOverAd() {
      // ओवर खत्म होते ही स्मार्टलिंक एड नए टैब में खुलेगा
      window.open(smartlinkUrl, '_blank');

      document.getElementById('ui-layer').classList.add('hidden');
      document.getElementById('ad-modal').classList.remove('hidden');
    }

    function closeAd() {
      document.getElementById('ad-modal').classList.add('hidden');
      document.getElementById('ui-layer').classList.remove('hidden');
    }
  </script>
</body>
</html>
