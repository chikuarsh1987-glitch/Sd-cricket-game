<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SD Cricket World</title>

  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: white; text-align: center; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
    .hidden { display: none !important; }
    
    #welcome-screen, #ad-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
    }
    
    .btn-play { background: #27ae60; color: white; border: none; padding: 12px 24px; font-size: 1.2rem; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    .btn-play:active { transform: scale(0.95); }
    
    #scoreboard { background: rgba(0,0,0,0.8); padding: 15px; font-size: 1.2rem; display: flex; justify-content: space-around; }
    #controls { padding: 20px; background: rgba(0,0,0,0.6); }
    .shot-btn { background: #e67e22; color: white; border: none; padding: 12px 20px; margin: 5px; border-radius: 5px; font-size: 1rem; cursor: pointer; }
    
    .smartlink-card {
      background: #222; border: 2px solid #27ae60; padding: 20px; border-radius: 10px; margin: 20px; width: 80%; max-width: 300px;
    }
  </style>
</head>
<body>

  <!-- WELCOME SCREEN -->
  <div id="welcome-screen">
    <h1>SD Cricket World</h1>
    <p>3D Realistic Cricket Game</p>
    <button class="btn-play" onclick="resetGame()">Play Match</button>
  </div>

  <!-- GAMEPLAY UI -->
  <div id="ui-layer" class="hidden">
    <div id="scoreboard">
      <div>Runs: <span id="runs">0</span>/<span id="wickets">0</span></div>
      <div>Overs: <span id="overs">0.0</span></div>
    </div>
    
    <div id="controls">
      <button class="shot-btn" onclick="playBall('Lofted')">Lofted</button>
      <button class="shot-btn" onclick="playBall('Ground')">Ground</button>
      <button class="shot-btn" onclick="playBall('Defend')">Defend</button>
    </div>
  </div>

  <!-- INNING BREAK / MATCH END SMARTLINK MODAL -->
  <div id="ad-modal" class="hidden">
    <h2 id="ad-title">Inning Break!</h2>
    <p id="ad-desc">Match Completed (5 Overs)</p>
    
    <div class="smartlink-card">
      <p style="margin-bottom: 10px; font-size: 0.9rem; color: #ccc;">Claim Bonus or Continue Match:</p>
      <!-- Smartlink Trigger Button -->
      <button class="btn-play" style="background: #e74c3c; width: 100%;" onclick="openSmartlink()">🎁 Continue / Claim Bonus</button>
    </div>

    <button class="btn-play" onclick="resetGame()">Play Again</button>
  </div>31347722

  <script>
    let totalRuns = 0;
    let wickets = 0;
    let totalBalls = 0;
    const maxOvers = 5; // 5 Overs match

    // ⚠️ यहाँ अपना Adsterra Smartlink URL पेस्ट करें
    const SMARTLINK_URL = "https://www.highperformancecpmgate.com/xxxxxx"; 

    function resetGame() {
      totalRuns = 0;
      wickets = 0;
      totalBalls = 0;
      updateScoreboard();
      
      document.getElementById('ad-modal').classList.add('hidden');
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('ui-layer').classList.remove('hidden');
    }

    function playBall(type) {
      if (totalBalls >= maxOvers * 6) return;

      let outcomes = [0, 1, 2, 4, 6, 'W'];
      let result = outcomes[Math.floor(Math.random() * outcomes.length)];

      if (result === 'W') {
        wickets++;
      } else {
        totalRuns += result;
      }
      totalBalls++;

      updateScoreboard();

      // 5 Overs (30 balls) खत्म होने पर Smartlink Modal दिखाना
      if (totalBalls >= maxOvers * 6) {
        showInningBreakModal();
      }
    }

    function updateScoreboard() {
      document.getElementById('runs').innerText = totalRuns;
      document.getElementById('wickets').innerText = wickets;
      let overs = Math.floor(totalBalls / 6);
      let balls = totalBalls % 6;
      document.getElementById('overs').innerText = `${overs}.${balls}`;
    }

    function showInningBreakModal() {
      document.getElementById('ui-layer').classList.add('hidden');
      document.getElementById('ad-modal').classList.remove('hidden');
    }

    // Smartlink खोलने का फ़ंक्शन
    function openSmartlink() {
      if (SMARTLINK_URL && SMARTLINK_URL !== "https://www.highperformancecpmgate.com/xxxxxx") {
        window.open(SMARTLINK_URL, '_blank');
      } else {
        alert("कृपया कोड में SMARTLINK_URL की जगह अपना Adsterra Smartlink डालें!");
      }
    }
  </script>

</body>
</html>
